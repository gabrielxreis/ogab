<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="serif.css" />
<script src="serif.js"></script>
<style>
html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #000; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
/* apresentador fictício (no vídeo real é o take do V1; aqui só um boneco para o exemplo) */
#video { background: radial-gradient(120% 70% at 50% 25%, #1f5687 0%, #123a63 45%, #081a2e 100%); }
#cabeca { position: absolute; left: 380px; top: 330px; width: 320px; height: 400px; border-radius: 48% 48% 44% 44%;
  background: radial-gradient(60% 55% at 45% 40%, #c69580, #7c5646); filter: blur(2px); }
#corpo { position: absolute; left: 90px; top: 760px; width: 900px; height: 1300px; border-radius: 420px 420px 0 0;
  background: radial-gradient(70% 40% at 50% 10%, #5a4030, #2b1d15 70%); filter: blur(2px); }
#l1 { top: 930px; } #l2 { top: 1430px; } #l3 { top: 1500px; } #l4 { top: 1480px; }
#pas { top: 1150px; } #rot { top: 1330px; } #sld { top: 1180px; }
/* papel cheio */
#t1, #t2, #t3, #t4 { font-size: 50px; } #t5 { font-size: 60px; }
#t1 { top: 330px; } #t2 { top: 300px; } #t4 { top: 880px; } #t5 { top: 860px; }
#cel { left: 375px; top: 760px; background: linear-gradient(170deg, #d9a27c 0%, #a35f3a 55%, #3d2216 100%); }
#cel b { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font-family: var(--s-serif); font-style: italic; font-weight: 800; font-size: 44px; color: #ffcf6e; }
#ico { left: 340px; top: 800px; } #cx { left: 300px; top: 760px; width: 480px; height: 480px; } #selo { left: 760px; top: 720px; }
#pts { position: absolute; left: 540px; top: 1000px; }
/* papel metade (tela dividida) */
#t3 { top: 180px; }
#a1 { left: 175px; top: 400px; } #a2 { left: 465px; top: 400px; } #a3 { left: 755px; top: 400px; }
/* marcas fictícias */
.s-marca.serifa { font-family: var(--s-serif); letter-spacing: .12em; font-weight: 500; }
.s-marca.caixa { font-family: var(--s-sans); font-weight: 700; letter-spacing: .14em; font-size: 28px; }
</style></head>
<body>
<div id="root" data-composition-id="serif-azul" data-start="0" data-duration="21" data-width="1080" data-height="1920" data-fps="30">

  <!-- talking head (fica embaixo de tudo) -->
  <div class="s-cena" id="video">
    <div id="corpo"></div><div id="cabeca"></div>
    <div class="s-vinheta"></div>
    <div class="s-leg inv" id="l1"></div>
    <div class="s-passos" id="pas" style="opacity:0"></div>
    <div class="s-rotulo" id="rot" style="opacity:0"></div>
    <div class="s-slider" id="sld" style="opacity:0">
      <div class="tit"><span>Iniciante</span><span>Profissional</span></div>
      <div class="trilho"><div class="cheio"></div><div class="bola"></div></div>
    </div>
    <div class="s-leg inv" id="l2"></div>
    <div class="s-leg inv" id="l3"></div>
    <div class="s-leg inv" id="l4"></div>
  </div>

  <!-- papel cheio: celular + ícone que encolhe -->
  <div class="s-cena s-papel s-painel" id="p1">
    <div class="s-aneis"><i></i><i></i></div>
    <div class="s-leg" id="t1"></div>
    <div class="s-cel" id="cel" style="opacity:0"><b>Vídeo campeão</b></div>
    <div class="s-leg" id="t2"></div>
    <div class="s-caixa" id="cx"></div>
    <div class="s-icone" id="ico" style="opacity:0"><div class="play"></div><div class="barras"></div></div>
    <div class="s-selo" id="selo" style="opacity:0">-25%</div>
    <div id="pts">
      <i class="s-ponto"></i><i class="s-ponto esc"></i><i class="s-ponto"></i><i class="s-ponto"></i><i class="s-ponto esc"></i>
      <i class="s-ponto"></i><i class="s-ponto"></i><i class="s-ponto esc"></i><i class="s-ponto"></i><i class="s-ponto"></i>
      <i class="s-ponto esc"></i><i class="s-ponto"></i><i class="s-ponto"></i><i class="s-ponto esc"></i>
    </div>
  </div>

  <!-- papel na metade de cima (tela dividida): amostras de cor -->
  <div class="s-cena s-papel s-painel metade" id="p2">
    <div class="s-leg" id="t3"></div>
    <div class="s-amostra" id="a1"><div class="cor" style="background:#000"></div><div class="nome">PRETO PURO</div><div class="hex">#000000</div></div>
    <div class="s-amostra" id="a2"><div class="cor" style="background:#fff"></div><div class="nome">BRANCO PURO</div><div class="hex">#FFFFFF</div></div>
    <div class="s-amostra" id="a3"><div class="cor" style="background:#ff1f1f"></div><div class="nome">VERMELHO VIVO</div><div class="hex">#FF1F1F</div></div>
  </div>

  <!-- papel cheio: nuvem de marcas (fictícias) + título final -->
  <div class="s-cena s-papel s-painel" id="p3">
    <div class="s-aneis"><i></i><i></i></div>
    <div class="s-leg" id="t4"></div>
    <div class="s-marca serifa m" style="left:330px;top:560px">MAISON LUNE</div>
    <div class="s-marca caixa m" style="left:650px;top:700px;color:#1d5a3c">ATELIER</div>
    <div class="s-marca serifa m" style="left:110px;top:1080px;font-style:italic">Véra</div>
    <div class="s-marca caixa m" style="left:690px;top:1120px">CASA ORO</div>
    <div class="s-marca serifa m" style="left:250px;top:1280px">OSTRA &amp; CO.</div>
    <div class="s-marca caixa m" style="left:110px;top:740px;font-size:22px">BELLAMI</div>
    <div class="s-leg" id="t5"></div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.set(["#p1", "#p3"], { yPercent: 100 }, 0); tl.set("#p2", { yPercent: -100 }, 0);

// 1. gancho no vídeo: legenda sans + "três erros" na serifada, passos acendem em vermelho (0-3.3)
S.legenda(tl, "#l1", 0.15, "Esses *três erros* / deixam sua edição amadora", { passo: 0.22 });
S.passos(tl, "#pas", 1.2, { erro: true });
S.sai(tl, "#l1", 3.2); S.sai(tl, "#pas", 3.2);
// 2. slider Iniciante -> Profissional (3.4-5.6)
S.slider(tl, "#sld", 3.4, { dur: 1.3 });
S.legenda(tl, "#l2", 3.5, "do iniciante / ao *profissional*", { passo: 0.24 });
S.sai(tl, "#sld", 5.45); S.sai(tl, "#l2", 5.45);
// 3. passo 1 com o rótulo e a dica na serifada (5.7-7.6)
S.passosLimpa(tl, "#pas", 5.6);
tl.to("#pas", { opacity: 1, filter: "blur(0px)", duration: 0.3 }, 5.7);
S.passo(tl, "#pas", 5.95, 1);
S.rotulo(tl, "#rot", 6.0, "Número 1");
S.legenda(tl, "#l3", 6.4, "*Pare de exagerar*", { passo: 0.2 });
// 4. papel sobe: celular cai e o título entra palavra a palavra (7.6-10)
S.painel(tl, "#p1", 7.6);
S.legenda(tl, "#t1", 7.95, "O que mais / *entrega o iniciante*", { passo: 0.2 });
S.cartao(tl, "#cel", 8.2);
// 5. troca de conteúdo no mesmo papel: ícone 3D nasce e encolhe 25% (10-12.6)
S.sai(tl, "#t1", 9.9); S.sai(tl, "#cel", 9.9, { y: 120 });
S.icone(tl, "#ico", 10.1);
S.legenda(tl, "#t2", 10.2, "Deixe tudo / *25% menor*", { passo: 0.22 });
S.encolhe(tl, "#ico", 11.1, { caixa: "#cx", selo: "#selo", pontos: "#pts .s-ponto" });
// 6. papel desce, volta o vídeo: passo 2 (12.6-14.3)
S.painelSai(tl, "#p1", 12.5);
tl.set(["#l3", "#rot"], { opacity: 0 }, 12.5);
S.passo(tl, "#pas", 12.95, 2);
S.rotulo(tl, "#rot", 13.0, "Número 2");
S.legenda(tl, "#l4", 13.4, "*Menos é mais*", { passo: 0.2 });
// 7. tela dividida: papel na metade de cima com as amostras de cor (14.3-16.6)
S.sai(tl, ["#pas", "#rot", "#l4"], 14.2);
tl.fromTo("#p2", { yPercent: -100 }, { yPercent: 0, duration: 0.45, ease: "power4.out" }, 14.3);
S.legenda(tl, "#t3", 14.55, "Iniciantes *sempre usam*", { passo: 0.2 });
S.amostras(tl, "#p2 .s-amostra", 15.0, { passo: 0.4 });
tl.to("#p2", { yPercent: -100, duration: 0.35, ease: "power3.in" }, 16.5);
// 8. papel cheio: nuvem de marcas em volta da frase (16.7-18.9)
S.painel(tl, "#p3", 16.7);
S.legenda(tl, "#t4", 17.0, "Marcas de luxo usam / *cores apagadas*", { passo: 0.18 });
S.nuvem(tl, "#p3 .m", 17.2, { passo: 0.22 });
// 9. some tudo; título final serifado (fina + itálica azul) (19-21)
S.sai(tl, ["#p3 .m", "#t4"], 18.9, { blur: 14 });
S.legenda(tl, "#t5", 19.15, "_Cores apagadas parecem_ / *mais premium.*", { passo: 0.16 });
tl.to("#p3", { opacity: 0, filter: "blur(10px)", duration: 0.35 }, 20.6);
window.__timelines["serif-azul"] = tl;
</script>
</body></html>
