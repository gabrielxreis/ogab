<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O Gab · recebendo vídeo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060A14; color: #E8EDF7; font: 14px/1.5 "Inter", system-ui, sans-serif; padding: 16px; }
  p { margin: 0; text-align: center; max-width: 32ch; }
</style>
</head>
<body>
<p id="msg">Esperando o vídeo do anúncio…</p>
<script>
// Recebe o vídeo que a página do anúncio (Biblioteca do Meta) manda por postMessage e grava pelo servidor local.
const msg = document.getElementById('msg');
window.addEventListener('message', async (e) => {
  const d = e.data || {};
  if (!d.jhon || !(d.blob instanceof Blob) || !/^\d+$/.test(String(d.id)) || !/^[A-Za-z0-9_-]+$/.test(String(d.cliente))) return;
  msg.textContent = 'Salvando o vídeo ' + d.id + '…';
  try {
    const r = await fetch('/receber?cliente=' + d.cliente + '&id=' + d.id, {method: 'POST', body: d.blob, headers: {'Content-Type': 'video/mp4'}});
    msg.textContent = r.ok ? 'Vídeo salvo. Pode fechar esta janela.' : 'O servidor recusou o vídeo (' + r.status + ').';
    e.source && e.source.postMessage({jhon: true, id: d.id, ok: r.ok}, '*');
    if (r.ok) setTimeout(() => window.close(), 300);
  } catch (err) {
    msg.textContent = 'Não consegui salvar: ' + err.message;
    e.source && e.source.postMessage({jhon: true, id: d.id, ok: false}, '*');
  }
});
if (window.opener) window.opener.postMessage({jhon: 'pronto'}, '*');
</script>
</body>
</html>
