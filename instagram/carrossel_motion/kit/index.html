<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1350" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "CS"; src: url("fonts/Poppins-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "CS"; src: url("fonts/Poppins-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "CS"; src: url("fonts/Poppins-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "CS"; src: url("fonts/Poppins-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "CS"; src: url("fonts/Poppins-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "CS"; src: url("fonts/Poppins-Black.ttf"); font-weight: 900; }
@font-face { font-family: "Mao"; src: url("fonts/PatrickHand-Regular.ttf"); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--fundo); }
:root { --fundo: #ECEAE6; --tinta: #121212; --cinza: #5d5a55; --dest: #E2683C; --app1: #4A2117; --app2: #2A130D; --cartao: #FFFFFF; }
#root { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: "CS", sans-serif; color: var(--tinta);
  background: radial-gradient(ellipse 60% 40% at 50% 38%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%), var(--fundo); }
.abs { position: absolute; }
.logo { left: 66px; top: 44px; display: flex; align-items: baseline; gap: 22px; }
.logo .nm { font-family: "Logo"; font-size: 40px; letter-spacing: -.02em; }
.logo .nm i { color: var(--dest); font-style: normal; }
.logo .nm:after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dest); vertical-align: 26px; margin-left: 3px; }
.bat { position: absolute; right: 30px; top: 26px; display: flex; gap: 3px; align-items: center; }
.bat i { width: 4px; height: 11px; background: #fff; border-radius: 1px; } .bat b { width: 22px; height: 11px; border: 1.5px solid #fff; border-radius: 3px; margin-left: 4px; }
.logo .hd { font-weight: 500; font-size: 22px; color: var(--cinza); }
.logo img { height: 46px; }
.cont { right: 66px; top: 56px; font-weight: 600; font-size: 22px; color: var(--cinza); letter-spacing: .02em; }
.tit { left: 62px; top: 112px; right: 40px; font-weight: 900; font-size: 98px; line-height: .92; letter-spacing: -.06em; word-spacing: .14em; text-transform: uppercase; }
.tit .l { display: block; overflow: hidden; padding: 14px 0 6px; margin-top: -14px; }
.tit .l span { display: inline-block; }
.tit .l.d span { color: var(--dest); }
.sub { left: 66px; right: 80px; font-weight: 400; font-size: 30px; line-height: 1.25; color: #3b3935; }
.sub b { font-weight: 700; color: var(--tinta); }
.rot { font-weight: 700; font-size: 17px; letter-spacing: .26em; color: #6d6a64; text-transform: uppercase; }
.card { position: absolute; background: var(--cartao); border-radius: 22px; box-shadow: 0 10px 30px rgba(60,40,20,.08), 0 1px 0 rgba(0,0,0,.03); }
.ent { display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.ico { width: 44px; height: 44px; border-radius: 12px; background: #F3F0EB; display: flex; align-items: center; justify-content: center; flex: none; }
.ico svg { width: 24px; height: 24px; }
.ent .t { font-weight: 600; font-size: 17px; line-height: 1.15; letter-spacing: -.01em; }
.ent .s { font-weight: 400; font-size: 12.5px; line-height: 1.2; color: #7a766f; margin-top: 3px; }
.dec { border: 2px solid var(--dest); box-shadow: 0 10px 30px rgba(226,104,60,.18); }
.dec .n { margin-left: auto; font-weight: 700; font-size: 24px; color: var(--dest); }
.dec .ico { background: #FCEFE8; }
.regras { padding: 22px 18px; }
.regras .r { border-top: 1px solid #ebe7e1; padding: 11px 0; font-size: 15px; line-height: 1.3; color: #333; }
.regras .r b { display: block; font-weight: 700; color: var(--tinta); }
.regras .r b:before { content: "→ "; color: var(--dest); font-weight: 400; }
.fios { position: absolute; inset: 0; pointer-events: none; }
.arrasta { right: 96px; bottom: 44px; font-family: "Mao"; font-size: 40px; color: #333; letter-spacing: .04em; }
.mao { font-family: "Mao"; }
/* celular */
.cel { position: absolute; width: 440px; height: 900px; border-radius: 64px; background: #f7f5f2; border: 10px solid #fbfaf8;
  box-shadow: 0 0 0 2px #dcd8d2, 0 40px 80px rgba(60,40,20,.18); overflow: hidden; }
.tela { position: absolute; inset: 0; border-radius: 54px; overflow: hidden; background: #F4F1ED; }
.topo { position: absolute; left: 0; right: 0; top: 0; height: 430px; background: linear-gradient(170deg, var(--app1), var(--app2)); border-radius: 0 0 34px 34px; color: #fff; }
.ilha { position: absolute; left: 150px; top: 18px; width: 120px; height: 34px; border-radius: 20px; background: #000; }
.hora { position: absolute; left: 34px; top: 22px; font-weight: 600; font-size: 18px; }
.av { position: absolute; left: 24px; top: 82px; width: 40px; height: 40px; border-radius: 50%; background: var(--dest); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.ola { position: absolute; left: 24px; top: 140px; font-weight: 700; font-size: 25px; }
.met { position: absolute; left: 24px; top: 194px; font-size: 15px; opacity: .8; }
.selo { position: absolute; right: 22px; top: 190px; font-size: 13px; font-weight: 600; color: #F2A07E; background: rgba(226,104,60,.18); border-radius: 12px; padding: 4px 10px; }
.num { position: absolute; left: 22px; top: 214px; font-weight: 800; font-size: 64px; letter-spacing: -.03em; }
.num small { font-size: 17px; font-weight: 500; opacity: .7; margin-left: 6px; letter-spacing: 0; }
.barra { position: absolute; left: 24px; right: 24px; top: 300px; height: 6px; border-radius: 4px; background: rgba(255,255,255,.18); }
.barra i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--dest); }
.tiles { position: absolute; left: 22px; right: 22px; top: 322px; display: flex; gap: 9px; }
.tile { flex: 1; height: 92px; line-height: 1.15; border-radius: 14px; background: #FBF4EE; color: var(--tinta); padding: 10px 12px; }
.tile svg { width: 15px; height: 15px; }
.tile b { display: block; font-size: 24px; font-weight: 700; margin: 2px 0 1px; line-height: 1.1; }
.tile span { font-size: 12px; color: #7a766f; }
.agora { position: absolute; left: 22px; right: 22px; top: 440px; display: flex; justify-content: space-between; align-items: baseline; }
.agora b { font-size: 19px; font-weight: 700; } .agora span { font-size: 13px; color: #8a867f; }
.lista { position: absolute; left: 14px; right: 14px; top: 476px; background: #fff; border-radius: 22px; padding: 4px 14px; }
.item { display: flex; align-items: center; gap: 10px; height: 66px; border-bottom: 1px solid #f0ece6; }
.item:last-child { border: none; }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #222; flex: none; position: relative; }
.chk i { position: absolute; inset: -2px; border-radius: 50%; background: #111; opacity: 0; }
.chk svg { position: absolute; left: 4px; top: 5px; width: 11px; opacity: 0; }
.ini { width: 38px; height: 38px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
.item .tx { flex: 1; min-width: 0; } .item .tx b { display: block; font-size: 15px; font-weight: 600; }
.item .tx span { display: block; font-size: 12px; color: #7a766f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 4px 8px; white-space: nowrap; }
.tag.ok { color: #2f9e5f; background: #E7F6EC; } .tag.neu { color: #6b675f; background: #F1EEE9; } .tag.al { color: #fff; background: var(--dest); }
.nav { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 78px; border-radius: 40px; background: #fff; display: flex; align-items: center; justify-content: space-around; padding: 0 12px; }
.nav .on { background: var(--dest); color: #fff; border-radius: 30px; padding: 12px 20px; font-weight: 600; font-size: 15px; }
.nav svg { width: 20px; height: 20px; }
.home { position: absolute; left: 160px; bottom: 8px; width: 120px; height: 5px; border-radius: 3px; background: #111; }
/* conexão */
.hub { position: absolute; border-radius: 30px; background: linear-gradient(165deg, var(--app1), var(--app2)); color: #fff; padding: 28px;
  box-shadow: 0 30px 70px rgba(226,104,60,.35), 0 0 0 2px rgba(226,104,60,.4); }
.hub .ico { background: var(--dest); } .hub .ico svg { stroke: #fff; }
.hub b { display: block; font-size: 28px; font-weight: 700; margin-top: 16px; line-height: 1.1; } .hub span { display: block; font-size: 16px; opacity: .8; margin-top: 6px; line-height: 1.25; }
.noti { padding: 24px 26px; }
.noti .q { display: flex; gap: 14px; align-items: center; } .noti .q .lg { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(165deg, var(--app1), var(--app2)); }
.noti .q b { font-size: 19px; font-weight: 600; } .noti .q span { display: block; font-size: 13px; color: #8a867f; } .noti .q em { margin-left: auto; font-style: normal; font-size: 14px; color: #8a867f; align-self: flex-start; }
.noti p { font-size: 22px; line-height: 1.35; margin-top: 14px; } .noti p b { font-weight: 700; }
/* cta */
.pill { display: inline-block; background: var(--dest); color: #fff; border-radius: 22px; padding: 0 22px 6px; box-shadow: 0 16px 40px rgba(226,104,60,.35); }
.coment { display: flex; align-items: center; gap: 14px; padding: 0 22px; }
.coment .a { width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c4703f, #6e2f19); flex: none; }
.coment small { display: block; font-size: 12px; color: #8a867f; } .coment b { font-size: 26px; font-weight: 800; }
.coment .car { display: inline-block; width: 3px; height: 26px; background: var(--dest); vertical-align: -4px; margin-left: 3px; }
.isca { position: absolute; border-radius: 26px; background: linear-gradient(165deg, var(--app1), var(--app2)); color: #fff; padding: 26px;
  border: 8px solid #fff; box-shadow: 0 30px 60px rgba(60,30,10,.3); }
.isca .tg { display: inline-block; background: var(--dest); border-radius: 8px; padding: 3px 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
.isca h3 { font-size: 36px; font-weight: 800; line-height: 1.02; margin-top: 14px; letter-spacing: -.02em; } .isca h3 em { font-style: normal; color: #F3956D; }
.isca .li { font-size: 17px; margin-top: 7px; opacity: .92; display: flex; align-items: center; gap: 9px; } .isca .li svg { width: 16px; height: 16px; }
.isca .pe { position: absolute; left: 26px; right: 26px; bottom: 20px; display: flex; justify-content: space-between; font-size: 12px; opacity: .7; }
/* capa */
.grade { position: absolute; left: 60px; right: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.ag { position: relative; background: #fff; border-radius: 24px; padding: 26px; height: var(--agh, 150px); display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 10px 30px rgba(60,40,20,.08); }
.ag .ico { background: #FCEFE8; width: 64px; height: 64px; border-radius: 18px; position: absolute; left: 26px; top: 26px; } .ag .ico svg { width: 34px; height: 34px; } .ag .nn { position: absolute; right: 22px; top: 20px; font-weight: 800; font-size: 20px; color: var(--dest); }
.ag b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -.01em; } .ag span { font-size: 18px; color: #7a766f; }
</style></head><body>
